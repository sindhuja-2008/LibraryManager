name: C++ build verification

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build with ${{ matrix.compiler }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        compiler: [g++, clang++]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Compile application
        run: |
          ${{ matrix.compiler }} --version
          ${{ matrix.compiler }} -std=c++11 -Wall -Wextra -pedantic \\
            main.cpp Library.cpp Book.cpp Member.cpp Loan.cpp -o library_manager
